<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020617"><title>বাংলাদেশ লোকাল ডিরেক্টরি</title><style>body{font-family:Arial,sans-serif;background:#f7f8f5;color:#0f172a;padding:24px}main{max-width:620px;margin:12vh auto;background:white;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 10px 30px #0000000d}h1{font-size:28px;margin:0 0 10px}p{line-height:1.8;color:#64748b}</style></head><body><main><h1>আপনি অফলাইনে আছেন</h1><p>সংরক্ষিত লোকাল ডিরেক্টরি ডেটা পাওয়া গেলে সেটি ব্যবহার করা যাবে। ম্যাপের লাইভ টাইল দেখতে ইন্টারনেট সংযোগ প্রয়োজন।</p></main></body></html>
